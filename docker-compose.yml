services:
  db:
    image: postgres:16-alpine
    container_name: finance-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finance -d finance']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal
    # No host ports — Postgres stays on the Docker network only (not LAN-exposed).

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: finance-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://finance:finance@db:5432/finance
      # Plain HTTP on LAN (smaug pattern). Set true only behind TLS.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://192.168.1.30:3100,http://localhost:3000}
      API_PORT: '4000'
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    # API is reached via the web reverse-proxy / same-origin rewrites — not published.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    container_name: finance-web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
    ports:
      # Free on smaug (avoid 6767,7878,8080,8191,8888,8989,9443,9696)
      - '3100:3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
